version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cipher-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cipher
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - cipher-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cipher-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cipher?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_ACCESS_SECRET: "FJSKXLD2OWEOLR1FKD2LSJ2KCVKS6DNFND3SM3LC6XCLFLODSPJOEWFJ3DS4FKLK6FDSKLKLELJK"
      JWT_ACCESS_EXPIRATION: 3600000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cipher-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local

networks:
  cipher-network:
    driver: bridge