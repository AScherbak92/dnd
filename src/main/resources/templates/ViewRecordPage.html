<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Просмотр записи</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/common.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/view-record.css}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="content-panel">
  <div class="back-link">
    <a th:href="@{/showRecords}">
      <button class="back-button">← Назад к списку</button>
    </a>
  </div>

  <div th:if="${entity != null}" class="record-container">
    <div class="record-header">
      <h2>📄 Просмотр записи</h2>
    </div>

    <div class="record-details">
      <div class="record-field">
        <label>Ключ:</label>
        <div class="field-value key-value" th:text="${entity.entityKey}"></div>
      </div>

      <div class="record-field">
        <label>Значение:</label>
        <div class="field-value value-content" th:text="${entity.entityValue}"></div>
      </div>
    </div>

    <div class="button-group">
      <a th:href="@{/showRecords}">
        <button class="btn btn-back">Вернуться к списку</button>
      </a>
    </div>
  </div>

  <div th:if="${entity == null}" class="error-section">
    <p class="error-message">Запись не найдена</p>
  </div>
</div>
</body>
</html>
