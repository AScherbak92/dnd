<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
  <title>Оставь надежду</title>
  <link rel="stylesheet" type="text/css" th:href="@{/css/common.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/cipher.css}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="content-panel">
    <div class="back-link">
      <a th:href="@{/}">
        <button class="back-button">Назад?</button>
      </a>
    </div>

    <!-- Основная форма создания -->
    <form id="createForm" th:action="@{/createEntity}" method="post" th:object="${cypheredEntityDTO}" class="create-form">
      <div class="form-row">
        <div class="form-group">
          <label for="entityKey">Ключ:</label>
          <input type="text" id="entityKey" th:field="*{entityKey}" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="entityValue">Значение:</label>
          <input type="text" id="entityValue" th:field="*{entityValue}" />
        </div>
      </div>

      <div class="button-group">
        <button type="submit" name="action" value="search" class="action-button search-button">Шифр</button>
      </div>
    </form>
  </div>
</body>
</html>
